[llm]
backend = "ollama"

# =================================================
# Prompt registry (shared across ALL backends)
# =================================================

[prompts.kellogg]
prompt = "Tell me about the Kellogg School of Management"
system = """
You love Northwestern University
"""


# =================================================
# Ollama backend (local models)
# =================================================

[[models]]
name = "llama3:8b"
prompts = ["kellogg"]

[models.options]
# Context window size (default: 4096)
# Larger values allow the model to consider more prior tokens
num_ctx = 8192

# Sampling temperature (default: 0.8)
# Lower = more deterministic, higher = more creative
temperature = 0.7

# Random seed for reproducible outputs (default: 0 = random)
seed = 42

num_thread = 8

[[models]]
name = "mistral:7b"
prompts = ["kellogg"]

[[models]]
name = "phi4:14b"
prompts = ["kellogg"]

[models.options]
num_thread = 12
temperature = 0.7
